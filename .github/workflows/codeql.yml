name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query reaches this repo without waiting
    # for someone to open a pull request.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  # Required only while this repository is private: the analyse step reads its
  # own workflow run, and without this the whole job ends in "Resource not
  # accessible by integration" *after* a clean scan. The failure is easy to
  # misread as a finding — it is not. The queries all ran; the results simply
  # never reached the Security tab, which is the worse half of it.
  actions: read

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # vendor/ is Mozilla's CA bundle, not our code.
          config: |
            paths-ignore:
              - vendor

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
